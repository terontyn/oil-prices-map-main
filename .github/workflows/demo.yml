name: OpenLayers demo smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AMN/oil-prices-map-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python demo/generate.py
      - run: python -m compileall -q src demo
      - run: test -s output/index.html && test -s output/demo-prices.csv
      - run: node --check output/js/map.js
